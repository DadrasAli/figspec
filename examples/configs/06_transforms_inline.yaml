# df_python filters the dataframe before the column is read; y_python
# transforms the y array afterwards. Both get 'np'/'pd' in scope and run
# with full Python privileges -- see the SECURITY note in csv_plotter.py.
# noisy.csv zig-zags (10,40,15,45,20,50) so the smoothing effect is obvious.
series:
  - csv: "../csv/noisy.csv"
    column: "value"
    label: "raw"
  - csv: "../csv/noisy.csv"
    column: "value"
    label: "EMA smoothed (inline y_python)"
    line_style: "dashed"
    y_python: |
      def transform_y(y, df):
          out = y.astype(float).copy()
          for i in range(1, len(out)):
              out[i] = 0.4 * out[i] + 0.6 * out[i - 1]
          return out

title: "Inline transform: y_python"
x_label: "Round"
y_label: "Value"
use_grid: true
output_basename: "out/06_transforms_inline"
