# A composite's panels are just ordinary plot configs, unmodified -- this file
# also renders standalone:
#   figspec --config configs/13a_panel_accuracy.yaml
series:
  - csv: "csvs/client_a.csv"
    column: "acc"
    label: "Client A"
  - csv: "csvs/client_b.csv"
    column: "acc"
    label: "Client B"
title: "Accuracy"
x_label: "Round"
y_label: "Accuracy"
use_grid: true
output_basename: "out/13a_panel_accuracy"
