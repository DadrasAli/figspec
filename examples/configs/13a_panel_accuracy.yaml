# A composite's panels are just ordinary plot configs, unmodified -- this
# file also renders standalone (try: csv_plotter.py --config 13a_panel_accuracy.yaml).
series:
  - csv: "../csv/client_a.csv"
    column: "acc"
    label: "Client A"
  - csv: "../csv/client_b.csv"
    column: "acc"
    label: "Client B"
title: "Accuracy"
x_label: "Round"
y_label: "Accuracy"
use_grid: true
output_basename: "out/13a_panel_accuracy"
