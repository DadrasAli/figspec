[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "figspec"
version = "0.1.0"
description = "Render matplotlib figures from a declarative YAML spec, backed by CSV data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ali Dadrass" }]
requires-python = ">=3.9"
keywords = ["matplotlib", "plotting", "yaml", "figures", "csv", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.20",
    "pandas>=1.3",
    "PyYAML>=5.4",
]

[project.urls]
Homepage = "https://github.com/DadrasAli/figspec"
Repository = "https://github.com/DadrasAli/figspec"
Issues = "https://github.com/DadrasAli/figspec/issues"

[project.scripts]
figspec = "figspec:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["figspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
