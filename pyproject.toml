[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "figspec"
version = "0.1.0"
description = "Render matplotlib figures from a declarative YAML spec, backed by CSV data"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.20",
    "pandas>=1.3",
    "PyYAML>=5.4",
]

[project.scripts]
figspec = "figspec:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["figspec"]
